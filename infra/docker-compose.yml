# HydraDB local dev (Phase 0.2) — seed of the Phase-9 compose file (adds engine + web).
# Bring up via ./up.sh (pre-creates store/cache dirs + auth token; compose can't).
# Digest pinned per PLAN decision 9; bump deliberately, never implicitly.
services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb@sha256:db78309a233be54662db29744047e985a39b51c45a270d1a1f47c31a62cdb709
    user: "${DOCKER_UID:-501}:${DOCKER_GID:-20}"
    ports:
      - "7687:7687" # Bolt (neo4j driver)
      - "8443:8443" # HTTP JSON/NDJSON query API
      - "9090:9090" # admin: /readyz, /metrics
    volumes:
      - ./hydradb-data:/data
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: default
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /data/auth-token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
      # NOTE (Phase 1.1): SLATEDB_AWAIT_DURABLE_WRITES=false was tried here and
      # is INERT — await_durable_writes is a per-write WriteOptions flag chosen
      # by graph-node, not a slatedb Settings field (flush_interval is already
      # 1ms). The ~230 writes/s single-statement ceiling is architectural in
      # this pinned build; see /infra/README.md "Write throughput".
