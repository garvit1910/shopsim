[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsim"
version = "0.1.0"
description = "Six-state-shopper market simulator on HydraDB (Hack Hydra, Track 3)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "neo4j>=5.20",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]
# perception extra: only the live LLM call needs it — the cached path
# (tests, CI, replays) never imports openai.
perception = ["openai>=1.40"]

[tool.setuptools.packages.find]
include = ["shopsim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
